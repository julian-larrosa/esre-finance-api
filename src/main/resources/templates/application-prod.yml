spring:
jpa:
show-sql:false
hibernate:
ddl-auto: validate
datasource:
url: ${DATABASE_URL}
username: ${DATABASE_USERNAME}
password: ${DATABASE_PASSWORD}
server:
port: ${SERVER_PORT:8080}
servlet:
context-path: /api
jwt:
secret: ${JWT_SECRET}
expiration: ${JWT_EXPIRATION:86400000}
logging:
level:
root: WARN
com.esre: INFO
file:
name: /var/log/esre/app.log